<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>History - E-Waste Management</title>
  <link rel="stylesheet" href="history.css" />
</head>
<body>
  <header class="history-header">
    <h2>Collection History</h2>
    <a href="index.html" class="back-button">&larr; Back</a>
  </header>

  <main class="history-container">
    <!-- Each card = one history record -->
    <div class="history-card success">
      <div class="history-left">
        <h3>Plastic Waste Pickup</h3>
        <p>12 Oct 2025 • 10:30 AM</p>
      </div>
      <div class="history-right">
        <span class="amount">+₹50</span>
        <p>Completed</p>
      </div>
    </div>

    <div class="history-card pending">
      <div class="history-left">
        <h3>E-Waste Pickup</h3>
        <p>10 Oct 2025 • 04:00 PM</p>
      </div>
      <div class="history-right">
        <span class="amount">₹0</span>
        <p>Pending</p>
      </div>
    </div>

    <div class="history-card failed">
      <div class="history-left">
        <h3>Metal Waste Pickup</h3>
        <p>08 Oct 2025 • 09:15 AM</p>
      </div>
      <div class="history-right">
        <span class="amount">₹0</span>
        <p>Cancelled</p>
      </div>
    </div>
  </main>

  <script src="history.js"></script>
</body>
</html>
