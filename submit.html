<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Submit E-Waste</title>
  <link rel="stylesheet" href="submit.css" />
</head>
<body>
  <header class="form-header">
    <h2>Submit Your E-Waste</h2>
    <a href="index.html" class="back-button">← Back</a>
  </header>

  <main class="form-container">
    <form id="ewaste-form">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your full name" required>

      <label for="contact">Contact Number</label>
      <input type="tel" id="contact" name="contact" placeholder="Enter your phone number" required>

      <label for="address">Pickup Address</label>
      <textarea id="address" name="address" placeholder="Enter your full address" required></textarea>

      <label for="wasteType">Type of E-Waste</label>
      <select id="wasteType" name="wasteType" required>
        <option value="">--Select Type--</option>
        <option value="mobile">Mobile / Tablet</option>
        <option value="computer">Computer / Laptop</option>
        <option value="tv">Television</option>
        <option value="battery">Battery / Charger</option>
        <option value="other">Other</option>
      </select>

      <label for="quantity">Quantity (approx.)</label>
      <input type="number" id="quantity" name="quantity" placeholder="Enter quantity" min="1" required>

      <label for="description">Description</label>
      <textarea id="description" name="description" placeholder="Add any notes (optional)"></textarea>

      <button type="submit" class="submit-btn">Submit</button>
    </form>

    <div id="success-message" class="hidden">
      ✅ Your waste has been submitted successfully!
    </div>
  </main>

  <script src="submit.js"></script>
</body>
</html>
